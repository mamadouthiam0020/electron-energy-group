# Blueprint Render — site statique Electron Energy Group
# Documentation : https://render.com/docs/blueprint-spec
#
# Domaine principal : https://www.electron-energy-group.com
# L'apex electron-energy-group.com redirige automatiquement vers www
# (Render ajoute et gère la redirection à partir du domaine www déclaré).

services:
  - type: web
    name: electron-energy-group
    runtime: static

    # Domaine canonique. Render ajoute automatiquement l'apex et le redirige vers www.
    domains:
      - www.electron-energy-group.com

    # Le sous-domaine onrender.com renvoie 404 (évite le contenu dupliqué).
    renderSubdomainPolicy: disabled

    # Aucune étape de build : les fichiers HTML/CSS/JS sont publiés tels quels.
    buildCommand: echo "Site statique — aucune build nécessaire"

    # Le site est publié depuis la racine du dépôt.
    staticPublishPath: .

    autoDeployTrigger: commit

    routes:
      # Éviter le contenu dupliqué : /index.html redirige vers /
      - type: redirect
        source: /index.html
        destination: /

    headers:
      # En-têtes de sécurité (tous chemins)
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: sameorigin
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

      # Pages HTML : toujours revalider pour servir la dernière version publiée
      - path: /*.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /
        name: Cache-Control
        value: public, max-age=0, must-revalidate

      # Fichiers SEO et favicon : cache court pour refléter les mises à jour
      - path: /robots.txt
        name: Cache-Control
        value: public, max-age=3600
      - path: /sitemap.xml
        name: Cache-Control
        value: public, max-age=3600
      - path: /site.webmanifest
        name: Cache-Control
        value: public, max-age=86400
      - path: /site.webmanifest
        name: Content-Type
        value: application/manifest+json; charset=utf-8
      - path: /favicon.ico
        name: Cache-Control
        value: public, max-age=86400

      # Polices : immuables (jamais modifiées)
      - path: /assets/fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

      # Images : cache d'un jour (les fichiers sont parfois modifiés sans être renommés)
      - path: /assets/img/*
        name: Cache-Control
        value: public, max-age=86400

      # CSS / JS : cache de 4 heures
      - path: /assets/css/*
        name: Cache-Control
        value: public, max-age=14400
      - path: /assets/js/*
        name: Cache-Control
        value: public, max-age=14400
